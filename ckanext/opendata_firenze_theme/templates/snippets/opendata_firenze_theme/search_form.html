{% from 'snippets/opendata_firenze_theme/icon.html' import icon %}
{% set field_id = id|default('rtt-search') %}
<form class="rtt-search rtt-search--sm rtt-search--pill" role="search" action="{{ h.url_for('dataset.search') }}" method="get">
  <label class="rtt-visually-hidden" for="{{ field_id }}">{{ _('Cerca nel sito') }}</label>
  <div class="rtt-search__field">
    <span class="rtt-search__icon" aria-hidden="true">{{ icon('search', 20) }}</span>
    <input id="{{ field_id }}" type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="{{ _('Cerca nel sito…') }}" autocomplete="off" enterkeyhint="search">
    <button class="rtt-search__submit" type="submit" aria-label="{{ _('Avvia la ricerca') }}">{{ icon('search', 20) }}</button>
  </div>
</form>
