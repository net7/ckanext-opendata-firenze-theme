opendata_firenze_theme-css:
  # Niente filtro cssrewrite: i font self-hosted sono referenziati con URL
  # assoluti (/fonts/...) e i token non referenziano immagini. Se in futuro
  # servissero url() relativi, registrare un public path per gli asset.
  output: opendata_firenze_theme/%(version)s-opendata_firenze_theme.css
  contents:
    - css/fonts.css
    - css/tokens/fig-tokens.css
    - css/tokens/semantic.css
    - css/tokens/typography.css
    - css/base.css
    - css/shell.css
    - css/snippets.css
    - css/home.css
    - css/catalog.css
    - css/responsive.css
    - css/dataset.css
    - css/resource.css
    - css/editorial.css
    - css/components.css
    - css/modal.css

opendata_firenze_theme-js:
  filters: rjsmin
  output: opendata_firenze_theme/%(version)s-opendata_firenze_theme.js
  contents:
    - js/header.js
    - js/reveal.js
    - js/dropdowns.js
    - js/pager.js
    - js/chips.js
    - js/copy.js
    - js/placeholders.js
    - js/line-clamp.js
    - js/sql-console.js
    - js/preview.js
    - js/home.js
    - js/contact.js
  extra:
    preload:
      - base/main
